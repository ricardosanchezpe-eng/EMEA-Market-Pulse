name: Verify all countries and datasets
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: full-source-verification
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate code and configuration
        run: |
          python -m py_compile scripts/*.py
          python -m json.tool public/data/indicator-contracts.json >/dev/null
          python -m json.tool public/data/indicator-methodology.json >/dev/null
          python -m json.tool public/data/market-pulse.json >/dev/null
      - name: Verify every configured dataset for every applicable country
        run: python scripts/verify_all_country_sources.py
      - name: Upload exhaustive verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-country-source-verification
          path: verification-output/
          if-no-files-found: error
          retention-days: 30

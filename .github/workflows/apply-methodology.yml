name: Apply full indicator methodology
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/apply_methodology.py
      - run: |
          python -m json.tool public/data/market-pulse.json > /dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/market-pulse.json
          git diff --cached --quiet || git commit -m "Restore full 51-indicator methodology"
          git push

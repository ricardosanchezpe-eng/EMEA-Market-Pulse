name: Verify complete data architecture
on:
  workflow_dispatch:
permissions: {contents: read}
concurrency: {group: data-architecture-verification, cancel-in-progress: true}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Validate code and contracts
        run: |
          python -m py_compile scripts/source_registry.py scripts/update_data.py scripts/audit_coverage.py scripts/verify_data_architecture.py
          python -m json.tool public/data/indicator-contracts.json > /dev/null
          python -m json.tool public/data/indicator-methodology.json > /dev/null
      - name: Test every configured adapter across representative countries
        run: python -u scripts/verify_data_architecture.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: data-architecture-verification
          path: |
            data-architecture-verification.json
            data-architecture-verification.md
          if-no-files-found: warn

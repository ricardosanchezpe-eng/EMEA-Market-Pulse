name: Refresh Market Trends
on:
  workflow_dispatch:
  schedule:
    - cron: '35 5 * * 3'
permissions:
  contents: write
concurrency:
  group: market-trends-refresh
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build dedicated Market Trends dataset
        run: python scripts/refresh_market_trends.py
      - name: Verify timelines YoY YTD nulls and source links
        run: python scripts/verify_market_trends.py
      - name: Commit refreshed Market Trends
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/data/market-trends.json
          git diff --cached --quiet || git commit -m "Refresh Market Trends dataset"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: market-trends-refresh-audit
          path: public/data/market-trends.json

name: Weekly market data refresh
on:
  workflow_dispatch:
  schedule:
    - cron: '30 5 * * 1'
    - cron: '30 6 * * 1'
permissions: {contents: write}
concurrency: {group: market-data-refresh, cancel-in-progress: true}
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - id: gate
        name: Europe/Madrid 07:30 gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          H=$(TZ=Europe/Madrid date +%H:%M); if [ "$H" = "07:30" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with: {python-version: '3.11'}
      - name: Validate code and source configuration
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m py_compile scripts/*.py
          python -m json.tool public/data/indicator-contracts.json >/dev/null
          python -m json.tool public/data/indicator-methodology.json >/dev/null
          python scripts/ensure_country_universe.py
      - name: Collect and verify every configured source-country combination
        if: steps.gate.outputs.run == 'true'
        env: {VERIFICATION_STRICT: '1'}
        run: python scripts/verify_all_country_sources.py
      - name: Apply every verified PASS observation to the live dataset
        if: steps.gate.outputs.run == 'true'
        run: python scripts/apply_verified_results.py
      - name: Build complete coverage audit
        if: steps.gate.outputs.run == 'true'
        run: python scripts/audit_coverage.py
      - name: Verify production parity
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m json.tool public/data/market-pulse.json >/dev/null
          python - <<'PY'
          import json
          p=json.load(open('public/data/verified-source-parity.json'))
          assert p['verifiedPassRows']==p['appliedPassRows'],p
          assert not p.get('unrepresented'),p.get('unrepresented')
          assert not p.get('mismatches'),p.get('mismatches')
          assert not p.get('technical'),p.get('technical')
          d=json.load(open('public/data/market-pulse.json'))
          assert len(d['europe'])==29 and len(d['emea'])==22
          f=next(c for c in d['europe'] if c['country']=='France')
          required=['gov_transport_investment','road_infra_expenditure','rail_infra_expenditure','motorway_network','rail_network']
          missing=[k for k in required if k not in f.get('indicators',{}) or f['indicators'][k].get('raw') is None]
          assert not missing,('France Transportation not materialized',missing)
          print('PRODUCTION_PARITY_OK',p['appliedPassRows'],'France Transportation populated')
          PY
      - name: Commit refreshed verified data
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/
          git diff --cached --quiet || git commit -m "Weekly verified market data refresh"
          git push
      - uses: actions/upload-artifact@v4
        if: always() && steps.gate.outputs.run == 'true'
        with:
          name: verified-market-data-audit
          path: |
            verification-output/
            public/data/verified-source-parity.json
            public/data/coverage-matrix.csv
            public/data/coverage-matrix.json
            public/data/coverage-summary.json
            public/data/coverage-audit.json
          if-no-files-found: error

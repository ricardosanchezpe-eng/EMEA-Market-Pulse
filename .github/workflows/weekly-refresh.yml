name: Weekly market data refresh
on:
  schedule:
    - cron: '30 5 * * 1'
    - cron: '30 6 * * 1'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run only at 07:30 Europe/Madrid
        id: localtime
        run: |
          HOUR=$(TZ=Europe/Madrid date +%H:%M)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$HOUR" = "07:30" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@v5
        if: steps.localtime.outputs.run == 'true'
        with: {python-version: '3.12'}
      - name: Refresh public datasets
        if: steps.localtime.outputs.run == 'true'
        run: python scripts/update_data.py
      - name: Commit refreshed dataset
        if: steps.localtime.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/market-pulse.json
          git diff --cached --quiet || git commit -m "Weekly market data refresh"
          git push

name: Weekly market data refresh v2.18
on:
  workflow_dispatch:
  schedule:
    - cron: '30 5 * * 1'
    - cron: '30 6 * * 1'
permissions: {contents: write}
concurrency: {group: market-data-refresh, cancel-in-progress: true}
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - id: gate
        run: |
          NOW=$(TZ=Europe/Madrid date +%H:%M)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$NOW" = "07:30" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with: {python-version: '3.12'}
      - name: Refresh every connected/candidate adapter country by country
        if: steps.gate.outputs.run == 'true'
        run: python -u scripts/update_data.py
      - name: Build full country × vertical × indicator audit
        if: steps.gate.outputs.run == 'true'
        run: python scripts/audit_coverage.py
      - name: Validate and commit
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m json.tool public/data/market-pulse.json > /dev/null
          python -m json.tool public/data/coverage-summary.json > /dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/*
          git diff --cached --quiet || git commit -m "Weekly contract-driven market refresh"
          git push
      - uses: actions/upload-artifact@v4
        if: always() && steps.gate.outputs.run == 'true'
        with:
          name: complete-coverage-audit
          path: |
            public/data/coverage-matrix.csv
            public/data/coverage-matrix.json
            public/data/coverage-summary.json
            public/data/coverage-audit.json
          if-no-files-found: warn

name: Weekly market data refresh
on:
  workflow_dispatch:
  schedule:
    - cron: '30 5 * * 1'
    - cron: '30 6 * * 1'
permissions: {contents: write}
concurrency: {group: market-data-refresh, cancel-in-progress: true}
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - id: gate
        run: |
          NOW=$(TZ=Europe/Madrid date +%H:%M)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$NOW" = "07:30" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with: {python-version: '3.12'}
      - if: steps.gate.outputs.run == 'true'
        run: python -u scripts/update_data.py
      - name: Validate refreshed country universe
        if: steps.gate.outputs.run == 'true'
        run: |
          python - <<'PY2'
          import json
          d=json.load(open("public/data/market-pulse.json"))
          n=len(d.get("europe",[]))+len(d.get("emea",[]))
          print("Countries available for audit:",n)
          assert n > 0, "Refresh produced zero countries; preserve/restore the populated market-pulse.json baseline before auditing."
          PY2
      - name: Build complete coverage audit
        if: steps.gate.outputs.run == 'true'
        run: python scripts/audit_coverage.py
      - if: steps.gate.outputs.run == 'true'
        run: |
          python -m json.tool public/data/market-pulse.json > /dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/*
          git diff --cached --quiet || git commit -m "Weekly explicit-contract market refresh"
          git push
      - uses: actions/upload-artifact@v4
        if: always() && steps.gate.outputs.run == 'true'
        with:
          name: complete-coverage-audit
          path: |
            public/data/coverage-matrix.csv
            public/data/coverage-matrix.json
            public/data/coverage-summary.json
            public/data/coverage-audit.json
          if-no-files-found: warn

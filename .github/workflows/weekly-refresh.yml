name: Weekly market data refresh
on:
  workflow_dispatch:
  schedule:
    - cron: '30 5 * * 1'
    - cron: '30 6 * * 1'
permissions: {contents: write}
concurrency: {group: market-data-refresh, cancel-in-progress: true}
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - id: gate
        run: |
          NOW=$(TZ=Europe/Madrid date +%H:%M)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$NOW" = "07:30" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with: {python-version: '3.12'}
      - name: Ensure complete country universe
        if: steps.gate.outputs.run == 'true'
        run: python scripts/ensure_country_universe.py
      - name: Refresh market data
        if: steps.gate.outputs.run == 'true'
        run: python -u scripts/update_data.py
      - name: Validate refreshed output
        if: steps.gate.outputs.run == 'true'
        run: |
          python - <<'PY'
          import json
          d=json.load(open('public/data/market-pulse.json'))
          eu=len(d.get('europe',[])); em=len(d.get('emea',[])); total=eu+em
          populated=sum(bool(c.get('indicators')) for c in d.get('europe',[])+d.get('emea',[]))
          observations=sum(len(c.get('indicators',{})) for c in d.get('europe',[])+d.get('emea',[]))
          print('Europe:',eu,'Broader EMEA:',em,'Total:',total,'Countries with indicators:',populated,'Indicator observations:',observations)
          assert eu==29 and em==22 and total==51
          assert populated>0, 'Refresh returned 51 country shells but zero countries with indicator data'
          assert observations>0, 'Refresh returned zero indicator observations'
          PY
      - name: Build complete coverage audit
        if: steps.gate.outputs.run == 'true'
        run: python scripts/audit_coverage.py
      - name: Commit refreshed data
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m json.tool public/data/market-pulse.json > /dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/*
          git diff --cached --quiet || git commit -m "Weekly market refresh"
          git push
      - uses: actions/upload-artifact@v4
        if: always() && steps.gate.outputs.run == 'true'
        with:
          name: complete-coverage-audit
          path: |
            public/data/coverage-matrix.csv
            public/data/coverage-matrix.json
            public/data/coverage-summary.json
            public/data/coverage-audit.json
          if-no-files-found: ignore

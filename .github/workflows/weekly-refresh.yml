name: Weekly market data refresh
on:
  schedule:
    - cron: '30 5 * * 1'
    - cron: '30 6 * * 1'
  workflow_dispatch:
permissions: {contents: write}
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - id: gate
        run: |
          NOW=$(TZ=Europe/Madrid date +%H:%M)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$NOW" = "07:30" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with: {python-version: '3.12'}
      - name: Refresh Eurostat and World Bank data
        if: steps.gate.outputs.run == 'true'
        run: python scripts/update_data.py
      - name: Validate useful output
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m json.tool public/data/market-pulse.json > /dev/null
          python - <<'PY'
          import json
          d=json.load(open('public/data/market-pulse.json'))
          n=sum(any(c.get(k) is not None for k in ['overall','transport','site','water','oil','mining','renewables','agriculture']) for c in d['europe'])
          print('countries with at least one score:',n)
          if n==0: raise SystemExit('No country scores generated')
          PY
      - name: Commit refreshed dataset
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/*.json
          git diff --cached --quiet || git commit -m "Weekly complete data architecture refresh"
          git push
      - uses: actions/upload-artifact@v4
        if: always() && steps.gate.outputs.run == 'true'
        with: {name: market-refresh-diagnostics, path: public/data/refresh-diagnostics.json, if-no-files-found: ignore}

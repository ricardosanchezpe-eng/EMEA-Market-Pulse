name: Deploy GitHub Pages
on:
  push: {branches: [main]}
  workflow_dispatch:
permissions: {contents: read, pages: write, id-token: write}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: npm install
      - run: npm run build
      - name: Verify complete deployed data artifact
        run: |
          test -f dist/data/market-pulse.json
          test -f dist/data/indicator-methodology.json
          python - <<'PYCODE'
          import json
          d=json.load(open('dist/data/market-pulse.json'))
          m=json.load(open('dist/data/indicator-methodology.json'))
          assert len(d.get('europe',[]))==29, len(d.get('europe',[]))
          assert len(d.get('emea',[]))==22, len(d.get('emea',[]))
          missing=[]; live_missing=[]
          for universe in ('europe','emea'):
              for c in d[universe]:
                  for vertical,rows in m.items():
                      for row in rows:
                          k=row['key']; st=c.get('sourceStatus',{}).get(k,{})
                          if st.get('retrieval')=='live' and c.get('indicators',{}).get(k,{}).get('raw') is None:
                              live_missing.append((universe,c['country'],vertical,k))
          assert not live_missing, live_missing[:20]
          print('DEPLOY_DATA_REFRESH',d.get('lastRefresh'))
          print('DEPLOY_COUNTRIES',len(d['europe']),len(d['emea']))
          print('DEPLOY_LIVE_OBSERVATION_PARITY_OK',sum(1 for u in ('europe','emea') for c in d[u] for z in c.get('indicators',{}).values() if z.get('raw') is not None))
          PYCODE
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: dist}
  deploy:
    environment: {name: github-pages, url: '${{ steps.deployment.outputs.page_url }}'}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
